<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>งานคดี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme:light; --bg:#f7f8fa; --fg:#1f2531; --muted:#5f6878; --faint:#9aa2ae; --line:#eaedf1; --card:#fff; --hover:#f5f7fb;
    --accent:#2f62c9; --accentbg:#edf2fd; --navy:#2f62c9; --navyfg:#fff;
    --red:#cc3b30; --redbg:#fdeeec; --amber:#b06a0a; --amberbg:#fdf4e4; --green:#22874b; --greenbg:#e8f6ee; --gbtn:#22874b; --chip:#f1f3f6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"FC Lamoon","IBM Plex Sans Thai","Noto Sans Thai",-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg);
    font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .app { max-width:1680px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom)); }

  /* header */
  .hdr { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .hdr h1 { font-size:21px; font-weight:700; margin:0; letter-spacing:-.01em; }
  .hdr .date { color:var(--muted); font-size:15px; }
  .sync { font-size:13px; color:var(--faint); opacity:0; transition:opacity .3s; }
  .sync.on, .sync.done { opacity:1; }
  .sync.done { color:var(--green); }
  .rv { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .rv .bar { width:90px; height:5px; background:var(--line); border-radius:4px; overflow:hidden; }
  .rv .bar i { display:block; height:100%; background:var(--green); }

  /* summary strip */
  .stats { display:flex; margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .stat { flex:1; min-width:0; border:0; background:none; padding:9px 10px 8px; text-align:left; transition:background .15s; }
  .stat + .stat { border-left:1px solid var(--line); }
  .stat:hover { background:var(--hover); }
  .stat.on { background:var(--accentbg); }
  .stat b { display:block; font-size:22px; font-weight:600; line-height:1.2; font-variant-numeric:tabular-nums; color:var(--fg); }
  .stat span { font-size:12.5px; color:var(--muted); white-space:nowrap; }
  .stat.red b { color:var(--red); } .stat.amber b { color:var(--amber); } .stat.blue b { color:var(--accent); } .stat.green b { color:var(--green); }
  .stat.zero b { color:var(--faint); font-weight:500; }
  .stat .mini { display:block; height:4px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px; }
  .stat .mini i { display:block; height:100%; background:var(--green); }
  .stat.rvt { display:none; }

  /* tabs, filters */
  .bar2 { display:flex; gap:10px; align-items:flex-end; margin-top:12px; position:sticky; top:0; z-index:3; background:var(--bg); padding-top:4px; }
  .tabs { display:flex; gap:22px; flex:1; border-bottom:1px solid var(--line); }
  .tabs button { border:0; background:none; font-weight:600; color:var(--faint); padding:6px 2px 7px; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs button.on { color:var(--fg); border-bottom-color:var(--accent); }
  .filters { display:flex; gap:4px; margin:8px 0 0; overflow-x:auto; scrollbar-width:none; }
  .filters::-webkit-scrollbar { display:none; }
  .filters button { flex:none; border:0; background:none; font-size:14px; padding:3px 10px; border-radius:16px; color:var(--muted); }
  .filters button:hover { background:var(--chip); }
  .filters button.on { background:var(--accentbg); color:var(--accent); font-weight:600; }
  .seg { display:inline-flex; gap:2px; margin-top:6px; background:var(--chip); border-radius:10px; padding:2px; }
  .seg button { border:0; background:none; font-size:13.5px; padding:3px 12px; border-radius:8px; color:var(--muted); }
  .seg button.on { background:var(--card); color:var(--fg); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.06); }

  /* surfaces: one soft panel per column, sections inside separated by hairlines */
  .panel, .card { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-top:10px; }
  .card { padding:12px 16px; }
  .section { padding:13px 16px; }
  .section + .section { border-top:1px solid var(--line); }
  .panel.list { overflow:hidden; }
  .case { display:block; width:100%; text-align:left; background:none; border:0; padding:11px 16px 11px 14px; border-top:1px solid var(--line); transition:background .12s; }
  .case:first-child { border-top:0; }
  .case:hover { background:var(--hover); }
  .case.sel { background:var(--accentbg); }
  .case .l1 { display:flex; align-items:center; gap:8px; }
  .lvdot { width:8px; height:8px; border-radius:50%; flex:none; background:transparent; }
  .lv-red .lvdot { background:var(--red); } .lv-amber .lvdot { background:#e3a33b; }
  .case .next { margin:2px 0 0 16px; font-size:14.5px; display:flex; gap:6px; align-items:baseline; min-width:0; color:var(--muted); }
  .case .next .txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }
  .case .l3 { margin:1px 0 0 16px; font-size:12.5px; color:var(--faint); }
  .case .l3 b { color:var(--red); font-weight:600; }
  .ok-dot { font-size:12.5px; color:var(--green); white-space:nowrap; }
  .no-dot { font-size:12.5px; color:var(--faint); white-space:nowrap; }
  .row { display:flex; align-items:center; gap:8px; }
  .grow { flex:1; min-width:0; }
  .id { font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .name { font-weight:600; font-size:16px; }
  .muted { color:var(--muted); font-size:14px; }
  .chip { display:inline-block; font-size:12.5px; padding:1px 8px; border-radius:9px; background:var(--chip); color:var(--muted); white-space:nowrap; }
  .chip.ok { background:var(--greenbg); color:var(--green); }
  .when { font-size:12.5px; padding:0 7px; border-radius:7px; white-space:nowrap; background:var(--chip); color:var(--muted); }
  .when.overdue { background:var(--redbg); color:var(--red); }
  .when.duesoon { background:var(--amberbg); color:var(--amber); }
  h2 { font-size:15px; font-weight:600; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  h2 .n { font-size:12.5px; font-weight:500; color:var(--faint); }
  .sec { font-size:12.5px; font-weight:600; color:var(--muted); margin:8px 0 0; }
  .sec.red { color:var(--red); } .sec.amber { color:var(--amber); }

  /* tasks */
  .task { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line); }
  .task:first-child, .sec + .task, h2 + .task, .sub + .task, .grouphead + .task { border-top:0; }
  .task input[type=checkbox] { width:19px; height:19px; margin-top:3px; flex:none; accent-color:var(--green); cursor:pointer; }
  .task .t { flex:1; min-width:0; }
  .task .text { font-size:15px; }
  .task.done .text { text-decoration:line-through; color:var(--faint); }
  .task .of { font-size:12.5px; color:var(--faint); }
  .meta { display:flex; gap:4px; flex-wrap:wrap; margin-top:2px; align-items:center; }
  .meta button, .meta label { border:0; background:var(--chip); color:var(--muted); font-size:12.5px; padding:0 8px; border-radius:7px; position:relative; line-height:1.75; }
  .meta .p-ด่วน { background:var(--redbg); color:var(--red); font-weight:600; }
  .meta .p-ปกติ { background:none; color:var(--faint); }
  .meta .p-ต่ำ { background:none; color:var(--faint); font-style:italic; }
  .meta input[type=date] { position:absolute; inset:0; opacity:0; width:100%; cursor:pointer; }
  .meta .overdue { background:var(--redbg); color:var(--red); }
  .meta .duesoon { background:var(--amberbg); color:var(--amber); }
  .meta .nodue { background:none; color:var(--faint); }
  .meta .act { background:none; color:var(--faint); padding:0 4px; opacity:.7; }
  .meta .act:hover { color:var(--accent); opacity:1; }
  .meta .sp { flex:1; }
  .task .id { opacity:.8; }

  /* buttons + forms */
  .btn { border:0; border-radius:9px; padding:8px 14px; font-weight:600; background:var(--accent); color:#fff; }
  .btn.ghost { background:none; border:1px solid var(--line); color:var(--fg); font-weight:500; }
  .btn.ghost:hover { background:var(--hover); }
  .btn.green { background:var(--gbtn); color:#fff; }
  .btn.red { background:none; border:1px solid #efc3bf; color:var(--red); }
  .btn.sm { padding:4px 10px; font-size:14px; }
  .btn:disabled { opacity:.5; }
  input[type=text], input[type=date], select, textarea { font:inherit; font-size:15.5px; width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:9px; background:#fbfcfd; color:var(--fg); }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--accentbg); border-color:#b9cbf0; background:#fff; }
  textarea { min-height:56px; resize:vertical; }
  .form { display:grid; gap:8px; }
  .form .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  details.add { margin-top:4px; }
  details.add summary { cursor:pointer; color:var(--accent); padding:4px 0; list-style:none; font-size:14px; }
  details.add summary::-webkit-details-marker { display:none; }
  details.add[open] summary { margin-bottom:6px; }
  details.more summary { cursor:pointer; list-style:none; }
  details.fold > summary { cursor:pointer; list-style:none; }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold > summary h2 { margin:0; flex-wrap:wrap; }
  details.fold > summary .chev { margin-left:auto; color:var(--faint); transition:transform .15s; }
  details.fold[open] > summary .chev { transform:rotate(90deg); }
  details.fold[open] > summary { margin-bottom:4px; }
  details.more summary::-webkit-details-marker { display:none; }
  .hist { font-size:13.5px; border-top:1px solid var(--line); padding:6px 0; color:var(--muted); }
  .hist b { color:var(--fg); font-weight:600; }
  .hist:first-child { border-top:0; }
  .hist a { color:var(--accent); word-break:break-all; }
  #hist { max-height:420px; overflow-y:auto; }
  .grouphead { display:block; width:100%; text-align:left; background:none; border:0; padding:0 0 2px; }
  .grouphead:hover .name { color:var(--accent); }
  .sub { font-size:12.5px; color:var(--faint); margin:6px 0 0; }
  .thumb { max-width:100%; max-height:180px; border-radius:8px; margin-top:6px; display:none; }
  .file { display:flex; gap:8px; align-items:center; }
  .file input[type=file] { display:none; }
  .file label { border:1px dashed #d5dae2; border-radius:9px; padding:5px 12px; font-size:14px; color:var(--muted); cursor:pointer; }
  .info .meta2 { color:var(--muted); font-size:14px; }
  .info .acts { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .info select { width:auto; font-size:14px; padding:4px 8px; }
  .rvrow { display:flex; gap:8px; margin-top:10px; }
  .rvrow input { flex:1; }
  .pill-list { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .pill-list button { border:1px solid var(--line); background:none; border-radius:16px; padding:1px 10px; font-size:13px; color:var(--muted); }
  .pill-list button:hover { border-color:#b9cbf0; color:var(--accent); }
  .empty { color:var(--faint); font-size:14px; padding:2px 0; }

  /* case pane: full screen on phones */
  .sheet { position:fixed; inset:0; background:var(--bg); z-index:10; overflow-y:auto; display:none; }
  .sheet.open { display:block; }
  .top { position:sticky; top:0; background:var(--bg); padding:calc(8px + env(safe-area-inset-top)) 14px 6px; z-index:2; display:flex; gap:10px; align-items:center; }
  .sheet .body { padding:0 14px calc(40px + env(safe-area-inset-bottom)); }
  .sheet.modal .body { max-width:560px; margin:0 auto; }
  .fab { position:fixed; right:16px; bottom:calc(18px + env(safe-area-inset-bottom)); border-radius:24px; padding:10px 18px; box-shadow:0 4px 14px rgba(47,98,201,.3); z-index:5; }
  .toast { position:fixed; left:50%; bottom:calc(80px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#2a2f3a; color:#fff; padding:7px 14px; border-radius:10px; font-size:14px; z-index:30; display:none; max-width:90%; }
  .err { color:var(--red); }
  .sets label { display:inline-flex; gap:4px; align-items:center; margin:2px 10px 2px 0; font-size:15px; }

  /* PC: case list left, open case (or today's overview) right */
  @media (min-width: 1000px) {
    body { font-size:15.5px; }
    .app { padding:20px 28px 30px; }
    .hdr h1 { font-size:22px; }
    .stat { padding:12px 18px 10px; }
    .stat b { font-size:26px; }
    .stat span { font-size:13px; }
    .stat.rvt { display:block; }
    .hdr .rv { display:none; }
    .filters { flex-wrap:wrap; overflow:visible; }
    .layout { display:grid; grid-template-columns:minmax(360px,430px) 1fr; gap:26px; align-items:start; margin-top:4px; }
    .left { min-width:0; }
    .sheet { position:sticky; top:12px; inset:auto; display:block; z-index:1; background:transparent; height:calc(100vh - 24px); overflow-y:auto; }
    .sheet .top { background:var(--bg); padding:10px 0 2px; }
    .sheet .body { padding:0 2px 20px; }
    .sheet.modal { position:fixed; inset:0; height:auto; background:rgba(30,36,48,.28); display:flex; align-items:flex-start; justify-content:center; padding-top:9vh; z-index:20; }
    .sheet.modal .inner { width:560px; background:var(--bg); border-radius:16px; padding:6px 16px 16px; box-shadow:0 20px 50px rgba(30,36,48,.18); }
    .fab { position:static; box-shadow:none; border-radius:9px; padding:5px 12px; font-size:14.5px; margin-bottom:4px; }
    .detail { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:0 18px; align-items:start; }
    #back.hide { display:none; }
  }
  @media (min-width: 1000px) and (max-width: 1250px) { .detail { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app">
  <div class="hdr"><h1>งานคดี</h1><span class="date" id="today"></span><span class="sync" id="sync"></span><div class="rv" id="progress"></div></div>
  <div class="stats" id="stats"></div>
  <div class="layout">
    <div class="left">
      <div class="bar2"><div class="tabs"><button id="tCases" class="on">คดี</button><button id="tTasks">งาน</button></div><button class="btn fab" id="fab">+ คดีใหม่</button></div>
      <div id="filters"></div>
      <div id="main"><div class="card muted">กำลังโหลด…</div></div>
    </div>
    <div class="sheet" id="sheet"><div class="top"><button class="btn ghost sm" id="back">‹ กลับ</button><div class="grow name" id="sheetTitle"></div></div><div class="body" id="sheetBody"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  function thDate(ymd, withYear) {
    var m = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return '';
    return (+m[3]) + ' ' + MONTHS[+m[2] - 1] + (withYear ? ' ' + String(+m[1] + 543).slice(-2) : '');
  }
  function days(a, b) { return Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 86400000); }
  function toast(s, bad) { var t = $('toast'); t.textContent = s; t.style.background = bad ? '#b42318' : '#222'; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = 'none'; }, bad ? 5000 : 2200); }

  /* The web app deployment ID comes in the LIFF endpoint URL (?u=…), set in the LINE console. */
  var u = new URLSearchParams(location.search).get('u') || '';
  try { if (/^[A-Za-z0-9_-]{20,}$/.test(u)) sessionStorage.setItem('ct.u', u); else u = sessionStorage.getItem('ct.u') || ''; } catch (e) { /* private mode */ }
  if (!/^[A-Za-z0-9_-]{20,}$/.test(u)) { $('main').innerHTML = '<div class="card">กรุณาเปิดหน้านี้จากปุ่มใน LINE</div>'; return; }
  var API = 'https://script.google.com/macros/s/' + u + '/exec';

  var D = null, view = 'cases', filter = 'all', kindF = 'all', openCase = null, token = null;
  var STEP = 'ขั้นตอนคดี', MINE = 'To-do';

  var CFG = null;
  /* LINE keeps a browser signed in for weeks, but its ID token lasts about an hour. On PC the old token is
     still handed out the next morning, so check it here and sign in again (LINE does it without a prompt). */
  function relogin() {
    try {   // at most one automatic sign-in a minute, so a failing sign-in can't loop
      var last = +sessionStorage.getItem('ct.relogin') || 0;
      if (Date.now() - last < 60000) return false;
      sessionStorage.setItem('ct.relogin', String(Date.now()));
    } catch (e) { /* ignore */ }
    try { liff.logout(); } catch (e) { /* ignore */ }
    liff.login({ redirectUri: location.href });
    return true;
  }
  /* The LIFF settings rarely change: use the copy from last time and refresh it in the background. */
  function getCfg() {
    var key = 'ct.cfg.' + u, have = null;
    try { have = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { /* ignore */ }
    var fresh = fetch(API + '?ct=config', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok || !j.liffId) throw new Error('ยังไม่ได้ตั้ง LIFF ID ในสคริปต์');
      try { localStorage.setItem(key, JSON.stringify({ ok: true, liffId: j.liffId, channelId: j.channelId })); } catch (e) { /* ignore */ }
      return j;
    });
    if (have && have.liffId) { fresh.catch(function () {}); return Promise.resolve(have); }
    return fresh;
  }
  function idToken() {
    if (token) return Promise.resolve(token);
    return getCfg().then(function (j) {
      CFG = j;
      return liff.init({ liffId: j.liffId });
    }).then(function () {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); throw new Error('กำลังเข้าสู่ระบบ LINE…'); }
      var dec = null;
      try { dec = liff.getDecodedIDToken(); } catch (e) { /* ignore */ }
      if (dec && CFG.channelId && String(dec.aud) !== String(CFG.channelId)) {
        throw new Error('ลิงก์นี้เป็นของเก่า กรุณาเปิด https://liff.line.me/' + CFG.liffId);
      }
      if (!dec || !dec.exp || dec.exp * 1000 < Date.now() + 60000) {
        if (relogin()) throw new Error('กำลังเข้าสู่ระบบ LINE ใหม่…');
        throw new Error('การเข้าสู่ระบบ LINE หมดอายุ กดรีเฟรชหน้านี้อีกครั้งในอีก 1 นาที');
      }
      token = liff.getIDToken();
      if (!token) throw new Error('กรุณาปิดแล้วเปิดใหม่จากใน LINE');
      try { sessionStorage.removeItem('ct.relogin'); } catch (e) { /* ignore */ }
      return token;
    });
  }
  var pending = 0, Q = Promise.resolve(), HIST = {};
  var SNAP = 'ct.snap.' + u;
  function sig(d) { return d ? JSON.stringify([d.cases, d.tasks]) : ''; }
  function setD(j) {
    var before = sig(D);
    D = j;
    try { localStorage.setItem(SNAP, JSON.stringify({ cases: j.cases, tasks: j.tasks, sets: j.sets, prios: j.prios, kinds: j.kinds, today: j.today })); } catch (e) { /* ignore */ }
    return before !== sig(D);
  }
  function sync(text) {
    var el = $('sync'); if (!el) return;
    if (text != null) { el.textContent = text; el.className = 'sync on'; return; }
    if (pending) { el.textContent = 'กำลังบันทึก…'; el.className = 'sync on'; }
    else { el.textContent = '✓ บันทึกแล้ว'; el.className = 'sync done'; clearTimeout(sync.h); sync.h = setTimeout(function () { el.className = 'sync'; }, 1500); }
  }
  function call(body) {
    if (openCase && body.ct !== 'history' && !body.hist) body.hist = openCase;
    return idToken().then(function (t) {
      body.idToken = t;
      return fetch(API, { method: 'POST', body: JSON.stringify(body), cache: 'no-store', referrerPolicy: 'no-referrer',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.needClaim) { showClaim(); throw new Error('ใส่รหัสเจ้าของก่อน'); }
      if (!j.ok) {
        if (/ยืนยันตัวตน/.test(j.error || '')) { token = null; if (relogin()) throw new Error('กำลังเข้าสู่ระบบ LINE ใหม่…'); }
        throw new Error(j.error || 'เกิดข้อผิดพลาด');
      }
      // a reply only replaces what's on screen when no later change is still on its way

  }
  function send(body) {
    pending++; sync();

  }
  function rerender() { render(); if (openCase) renderCase(); }
  /** Changes that need the server's answer (new IDs, closing a case): wait for it. */
  function act(body, okText) {
    return send(body).then(function (j) { rerender(); if (okText) toast(okText); return j; })
      .catch(function (e) { toast(e.message, true); throw e; });
  }
  /** Small changes: show them at once, save in the background, put things right if saving fails. */
  function fast(mutate, body, okText) {
    mutate(); rerender(); if (okText) toast(okText);
    return send(body).then(function (j) { if (j.changed) rerender(); return j; }, function (e) {
      toast(e.message, true);
      send({ ct: 'load' }).then(rerender, function () {});

    });
  }
  function taskById(id) { return D.tasks.filter(function (x) { return x.id === id; })[0]; }
  function saving(id) { if (/^NEW/.test(id)) { toast('กำลังบันทึกงานนี้ รอสักครู่'); return true; } return false; }

  function showClaim() {
    $('main').innerHTML = '<div class="card form"><h2>ครั้งแรก: ยืนยันว่าเป็นเจ้าของ</h2>' +
      '<div class="muted">ใส่รหัส 6 หลักที่ได้จาก caseTasks_setup ในสคริปต์</div>' +

      '<button class="btn" id="claimBtn">ยืนยัน</button></div>';

      call({ ct: 'claim', code: $('claimCode').value.trim() }).then(function () { render(); toast('ตั้งเป็นเจ้าของแล้ว'); })

  /* ---------- helpers on data ---------- */
  var DESK = window.matchMedia('(min-width: 1000px)');
  var newCaseOpen = false;
  function pref(k, v) { try { if (v === undefined) return localStorage.getItem('ct.' + k); localStorage.setItem('ct.' + k, v); } catch (e) { return null; } }
  var stepsOpen = pref('stepsOpen') === '1';
  kindF = pref('kindF');   // the งาน tab opens on To-do; ขั้นตอนคดี is one tap away
  if ([MINE, STEP, 'all'].indexOf(kindF) < 0) kindF = MINE;
  function caseOf(id) { return D.cases.filter(function (c) { return c.id === id; })[0]; }
  function reviewedToday(c) { return c.review && c.review >= D.today; }
  function openTasks(caseId) { return D.tasks.filter(function (t) { return t.status === 'ค้าง' && (!caseId || t.caseId === caseId); }); }
  function liveTasks() { return openTasks().filter(function (t) { var c = caseOf(t.caseId); return !c || c.active; }); }
  function kindOf(t) { return t.kind === STEP ? STEP : MINE; }
  var PR = { 'ด่วน': 0, 'ปกติ': 1, 'ต่ำ': 2 };
  function byDue(a, b) { return (a.due || '9') < (b.due || '9') ? -1 : (a.due || '9') > (b.due || '9') ? 1 : 0; }
  function byPrioDue(a, b) { return (PR[a.prio] - PR[b.prio]) || byDue(a, b); }
  function dd(t) { return t.due ? days(t.due, D.today) : null; }
  var IN = {   // the task filters, also used by the summary tiles
    all: function () { return true; },
    overdue: function (t) { return t.due && dd(t) < 0; },
    today: function (t) { return t.due && dd(t) === 0; },
    week: function (t) { return t.due && dd(t) > 0 && dd(t) <= 7; },
    urgent: function (t) { return t.prio === 'ด่วน'; },
    nodate: function (t) { return !t.due; },
  };
  function whenTxt(t) {
    var d = dd(t);
    if (d === null) return '';
    if (d < 0) return 'เลย ' + (-d) + ' วัน';
    if (d === 0) return 'วันนี้';
    if (d === 1) return 'พรุ่งนี้';
    return thDate(t.due, t.due.slice(0, 4) !== D.today.slice(0, 4));
  }
  function whenCls(t) { var d = dd(t); return d === null ? '' : d < 0 ? 'overdue' : d <= 3 ? 'duesoon' : ''; }
  function dueChip(t) {
    if (!t.due) return '<label class="nodue">+ กำหนด<input type="date" data-due="' + t.id + '"></label>';
    var cls = t.status === 'ค้าง' ? whenCls(t) : '';
    var txt = t.status === 'ค้าง' ? whenTxt(t) : thDate(t.due);
    return '<label class="' + cls + '" title="' + esc(thDate(t.due, true)) + '">' + esc(txt) + '<input type="date" data-due="' + t.id + '" value="' + t.due + '"></label>';
  }
  function taskHtml(t, showCase, canMove) {
    var c = caseOf(t.caseId) || { name: t.caseId };
    return '<div class="task' + (t.status === 'เสร็จ' ? ' done' : '') + '">' +
      '<input type="checkbox" data-done="' + t.id + '"' + (t.status === 'เสร็จ' ? ' checked' : '') + ' title="เสร็จ">' +
      '<div class="t">' + (showCase ? '<div class="of">' + esc(t.caseId) + ' ' + esc(c.name) + '</div>' : '') + '<div class="text">' + esc(t.text) + '</div>' +
      '<div class="meta">' + dueChip(t) + '<button data-prio="' + t.id + '" class="p-' + esc(t.prio) + '" title="แตะเพื่อเปลี่ยนความสำคัญ">' + esc(t.prio) + '</button>' +
      '<span class="sp"></span><span class="id">' + esc(t.id) + '</span>' +
      '<button class="act" data-proof-task="' + t.id + '" data-case="' + esc(t.caseId) + '" title="เพิ่มหลักฐาน">📎</button>' +
      (canMove ? '<button class="act" data-move="' + t.id + '" title="ย้ายไป ' + (kindOf(t) === STEP ? MINE : STEP) + '">⇄</button>' : '') +
      '</div></div></div>';
  }
  function bindTasks(root) {
    root.querySelectorAll('[data-done]').forEach(function (el) {
      el.onchange = function () {
        var id = el.getAttribute('data-done'), st = el.checked ? 'เสร็จ' : 'ค้าง';
        if (saving(id)) { el.checked = !el.checked; return; }
        fast(function () { taskById(id).status = st; }, { ct: 'task', taskId: id, status: st }, el.checked ? '✓ ' + id + ' เสร็จ' : id + ' กลับเป็นค้าง').catch(function () {});
      };
    });
    root.querySelectorAll('[data-prio]').forEach(function (el) {
      el.onclick = function () {
        var t = taskById(el.getAttribute('data-prio'));

        fast(function () { t.prio = next; }, { ct: 'task', taskId: t.id, prio: next }).catch(function () {});
      };
    });
    root.querySelectorAll('input[data-due]').forEach(function (el) {
      el.onchange = function () {
        var t = taskById(el.getAttribute('data-due')), v = el.value || '';
        if (saving(t.id)) return;

      };
    });
    root.querySelectorAll('[data-move]').forEach(function (el) {
      el.onclick = function () {
        var t = taskById(el.getAttribute('data-move'));
        if (saving(t.id)) return;
        var to = kindOf(t) === STEP ? MINE : STEP;
        fast(function () { t.kind = to; }, { ct: 'task', taskId: t.id, kind: to }, t.id + ' ย้ายไป ' + to).catch(function () {});
      };
    });
    root.querySelectorAll('[data-proof-task]').forEach(function (el) {
      el.onclick = function () { openProof(el.getAttribute('data-case'), el.getAttribute('data-proof-task')); };
    });

  }
  function openCaseId(id) { openCase = id; newCaseOpen = false; renderCase(true); render(); }

  /* ---------- header, tiles, lists ---------- */
  function render() {
    if (!D) return;
    $('today').textContent = thDate(D.today, true);
    var active = D.cases.filter(function (c) { return c.active; });
    var done = active.filter(reviewedToday).length;
    $('progress').innerHTML = '<span>ตรวจแล้ววันนี้ <b>' + done + '/' + active.length + '</b></span><span class="bar"><i style="width:' +
      (active.length ? Math.round(done * 100 / active.length) : 0) + '%"></i></span>';
    var live = liveTasks();
    var tiles = [['overdue', 'เลยกำหนด', 'red'], ['today', 'ครบวันนี้', 'amber'], ['week', 'ใน 7 วัน', 'blue'], ['urgent', 'ด่วน', 'red']];
    $('stats').innerHTML = tiles.map(function (s) {
      var n = live.filter(IN[s[0]]).length;
      return '<button class="stat ' + s[2] + (n ? '' : ' zero') + (view === 'tasks' && filter === s[0] ? ' on' : '') + '" data-tile="' + s[0] + '"><b>' + n + '</b><span>' + s[1] + '</span></button>';
    }).join('') + '<button class="stat green rvt' + (view === 'cases' && filter === 'todo' ? ' on' : '') + '" data-rv="1"><b>' + done + '<span style="font-size:15px;color:var(--faint)">/' + active.length + '</span></b>' +
      '<span>ตรวจแล้ววันนี้</span><span class="mini"><i style="width:' + (active.length ? Math.round(done * 100 / active.length) : 0) + '%"></i></span></button>';
    $('stats').querySelector('[data-rv]').onclick = function () { filter = (view === 'cases' && filter === 'todo') ? 'all' : 'todo'; view = 'cases'; render(); };
    $('stats').querySelectorAll('[data-tile]').forEach(function (b) {
      b.onclick = function () { var f = b.getAttribute('data-tile'); filter = (view === 'tasks' && filter === f) ? 'all' : f; view = 'tasks'; kindF = 'all'; render(); };
    });
    $('tCases').classList.toggle('on', view === 'cases');
    $('tTasks').classList.toggle('on', view === 'tasks');

      : [['all', 'ค้างทั้งหมด'], ['overdue', 'เลยกำหนด'], ['today', 'วันนี้'], ['week', '7 วัน'], ['urgent', 'ด่วน'], ['nodate', 'ไม่มีกำหนด']];
    if (!opts.some(function (o) { return o[0] === filter; })) filter = 'all';
    $('filters').innerHTML = '<div class="filters">' + opts.map(function (o) { return '<button data-f="' + o[0] + '" class="' + (filter === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div>' +
      (view === 'tasks' ? '<div class="seg">' + [[MINE, MINE], [STEP, STEP], ['all', 'ทั้งหมด']].map(function (o) {

  }

  /* how pressing a case is: 2 = something overdue or due today, 1 = ด่วน or due within 3 days */
  function level(open) {
    if (open.some(function (t) { return t.due && dd(t) <= 0; })) return 2;
    if (open.some(function (t) { return t.prio === 'ด่วน' || (t.due && dd(t) <= 3); })) return 1;
    return 0;
  }
  function renderCases() {
    var list = D.cases.filter(function (c) {
      return filter === 'closed' ? !c.active : c.active && (filter !== 'todo' || !reviewedToday(c));
    }).map(function (c) {
      var open = openTasks(c.id);
      var dated = open.filter(function (t) { return t.due; }).sort(byDue);
      var watch = function (t) { return kindOf(t) === MINE || t.prio === 'ด่วน' || (t.due && dd(t) <= 3); };
      var first = dated.filter(watch)[0] || open.filter(watch).sort(byPrioDue)[0] || dated[0] || open.slice().sort(byPrioDue)[0];
      return { c: c, open: open, lv: level(open), next: first };
    });
    list.sort(function (a, b) { return (b.lv - a.lv) || (reviewedToday(a.c) - reviewedToday(b.c)) ||
      ((a.next && a.next.due) || '9').localeCompare((b.next && b.next.due) || '9') || a.c.id.localeCompare(b.c.id); });
    var today = !DESK.matches && view === 'cases' && filter === 'all' ? todayCard() : '';

    }).join('') + '</div>';
    $('main').querySelectorAll('[data-case]').forEach(function (el) { el.onclick = function () { openCaseId(el.getAttribute('data-case')); }; });
    bindTasks($('main'));

    });
  }

  /* phone: a short "ต้องทำวันนี้" card above the cases */
  function todayCard() {
    var due = liveTasks().filter(function (t) { return t.due && dd(t) <= 0; }).sort(byDue);
    if (!due.length) return '';
    return '<div class="card"><h2>ต้องทำวันนี้ <span class="n">' + due.length + '</span></h2>' + due.slice(0, 5).map(function (t) { return taskHtml(t, true); }).join('') +

  function renderTaskList() {

  /* PC, nothing open: today's overview in the right pane */

      '<div class="section"><h2>ใน 7 วันข้างหน้า</h2>' + (wk.length ? wk.map(function (t) { return taskHtml(t, true); }).join('') : '<div class="empty">ไม่มี</div>') + '</div>' +
      '</div><div class="panel">' +
      (ur.length ? '<div class="section"><h2>ด่วน ยังไม่มีกำหนด <span class="n">' + ur.length + '</span></h2>' + ur.map(function (t) { return taskHtml(t, true); }).join('') + '</div>' : '') +

  /* ---------- one case ---------- */
  function listCard(kind, open, key, placeholder, extra) {

    var items = (ts.length ? ts.map(function (t) { return taskHtml(t, false, true); }).join('') : '<div class="empty">ไม่มี</div>') +
      '<details class="add"' + (kind === MINE && !ts.length ? ' open' : '') + '><summary>' + (kind === MINE ? '+ เพิ่ม To-do' : '+ เพิ่มขั้นตอน') + '</summary>' +

      '<button class="btn" id="' + key + 'Btn">เพิ่ม</button></div></details>' + (extra ? '<div style="margin-top:6px">' + extra + '</div>' : '');

  function renderCase(first) {
    var c = caseOf(openCase);
    if (!c) { closeSheet(); return; }
    $('sheet').classList.add('open');
    $('back').classList.remove('hide');
    $('back').textContent = DESK.matches ? '✕ ปิด' : '‹ กลับ';
    $('sheetTitle').innerHTML = '<span class="id">' + esc(c.id) + '</span> ' + esc(c.name);
    var tasks = D.tasks.filter(function (t) { return t.caseId === c.id; });
    var open = tasks.filter(function (t) { return t.status === 'ค้าง'; }).sort(byPrioDue);
    var done = tasks.filter(function (t) { return t.status === 'เสร็จ'; });
    var statuses = ['กำลังสอบสวน', 'ส่งสำนวนแล้ว', 'ปิด', 'ตรวจสอบ'];
    var openAdds = [].slice.call($('sheetBody').querySelectorAll('details.add[open]')).map(function (d) { return d.parentNode.id; });
    $('sheetBody').innerHTML = '<div class="detail"><div class="panel">' +
      '<div class="section info"><div class="meta2">' + esc([c.type, c.fileType, c.caseNo && 'คดีที่ ' + c.caseNo].filter(Boolean).join(' · ')) + '</div>' +
      '<div class="meta2">' + [c.complaint && 'รับคำร้องทุกข์ ' + esc(thDate(c.complaint, true)), c.charge && 'จับ/แจ้งข้อหา ' + esc(thDate(c.charge, true))].filter(Boolean).join(' · ') + '</div>' +
      '<div class="acts"><select id="cStatus">' + statuses.map(function (s) { return '<option' + (s === c.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>' +
      '<button class="btn ghost sm" id="rename">แก้ชื่อ</button>' + (reviewedToday(c) ? '<span class="chip ok">✓ ตรวจแล้ววันนี้</span>' : '') + '</div>' +
      '<div class="rvrow"><input type="text" id="rvNote" placeholder="ตรวจแล้วพบอะไร (ไม่บังคับ)">' +
      '<button class="btn green" id="rvBtn">' + (reviewedToday(c) ? 'บันทึกอีกครั้ง' : '✓ ตรวจแล้ว') + '</button></div></div>' +
      listCard(MINE, open, 'mine', 'เช่น โทรนัดพยาน, ทำบันทึกข้อความ') +
      listCard(STEP, open, 'step', 'เช่น ยื่นฝากขังครั้งที่ 3',
        c.sets.length ? '<button class="btn ghost sm" id="clBtn">+ จากเช็กลิสต์ (' + esc(c.sets.join(', ')) + ')</button>' : '') +
      (done.length ? '<div class="section"><details class="more"><summary><h2 style="margin:0">เสร็จแล้ว <span class="n">' + done.length + ' ▾</span></h2></summary>' +
        done.map(function (t) { return taskHtml(t); }).join('') + '</details></div>' : '') +
      '</div><div class="panel">' +
      '<div class="section form"><h2>หลักฐาน / บันทึก</h2><textarea class="pfNote" placeholder="ทำอะไรไป เช่น ยื่นฝากขังครั้งที่ 2 ศาลอนุญาต"></textarea>' +
      '<div class="file"><label>📷 แนบรูป<input type="file" class="pfPhoto" accept="image/*"></label><span class="muted pfName"></span></div><img class="thumb pfThumb" alt="">' +
      '<button class="btn pfBtn">บันทึกหลักฐาน</button></div>' +
      '<div class="section"><h2>ประวัติ</h2><div id="hist" class="muted">กำลังโหลด…</div></div>' +
      (c.active
        ? '<div class="section form"><h2>ปิดคดี</h2><div class="muted">งานที่ยังค้างจะถูกยกเลิก (กลับมาได้ถ้าเปิดคดีอีกครั้ง)</div>' +
          '<input type="text" id="clNote" placeholder="หมายเหตุ เช่น ส่งสำนวนตามหนังสือที่ ... (ไม่บังคับ)">' +
          '<div class="two"><button class="btn green" id="clSent">ส่งสำนวนแล้ว</button><button class="btn red" id="clClose">ปิดคดี</button></div></div>'
        : '<div class="section form"><div class="chip">' + esc(c.status) + '</div><button class="btn ghost" id="reopen">เปิดคดีอีกครั้ง</button></div>') +
      '</div></div>';

    if (!first) openAdds.forEach(function (id) { var d = $(id) && $(id).querySelector('details.add'); if (d) d.open = true; });
    var fold = $('sheetBody').querySelector('details.fold');
    if (fold) fold.addEventListener('toggle', function () { stepsOpen = fold.open; pref('stepsOpen', stepsOpen ? '1' : '0'); });
    bindTasks($('sheetBody'));
    $('rename').onclick = function () {
      var n = prompt('ชื่อคดีใหม่', c.name);
      if (n && n.trim() && n.trim() !== c.name) fast(function () { c.name = n.trim(); }, { ct: 'rename', caseId: c.id, name: n.trim() }, 'เปลี่ยนชื่อแล้ว').catch(function () {});
    };
    var closeAs = function (status) {
      if (!confirm(c.id + ' ' + c.name + '\n' + status + '\nงานค้าง ' + open.length + ' งานจะถูกยกเลิก')) return;
      act({ ct: 'closeCase', caseId: c.id, status: status, note: $('clNote').value.trim() }, c.id + ' ' + status).catch(function () {});
    };
    if ($('clSent')) { $('clSent').onclick = function () { closeAs('ส่งสำนวนแล้ว'); }; $('clClose').onclick = function () { closeAs('ปิด'); }; }
    if ($('reopen')) $('reopen').onclick = function () { act({ ct: 'reopen', caseId: c.id }, 'เปิด ' + c.id + ' อีกครั้งแล้ว').catch(function () {}); };
    $('cStatus').onchange = function () {
      var v = this.value;
      fast(function () { c.status = v; c.active = !/ปิด|ส่งสำนวนแล้ว/.test(v); }, { ct: 'caseStatus', caseId: c.id, status: v }, 'เปลี่ยนสถานะแล้ว').catch(function () {});
    };
    $('rvBtn').onclick = function () {
      var note = $('rvNote').value.trim();
      fast(function () { c.review = D.today; }, { ct: 'review', caseId: c.id, note: note }, '✓ ตรวจ ' + c.id + ' แล้ว').catch(function () {});
    };
    [['mine', MINE], ['step', STEP]].forEach(function (k) {
      var btn = $(k[0] + 'Btn');
      btn.onclick = function () {
        var text = $(k[0] + 'Text').value.trim();
        if (!text) { toast('ใส่ข้อความก่อน', true); return; }
        var due = $(k[0] + 'Due').value, prio = $(k[0] + 'Prio').value;
        var tmp = { id: 'NEW' + Date.now(), caseId: c.id, text: text, due: due, status: 'ค้าง', prio: prio, note: '', kind: k[1] };
        fast(function () { D.tasks.push(tmp); }, { ct: 'addTask', caseId: c.id, kind: k[1], text: text, due: due, prio: prio }, 'เพิ่มใน ' + k[1] + ' แล้ว')
          .then(function (j) { if (!j.changed) rerender(); }, function () {});
        if ($(k[0] + 'Text')) $(k[0] + 'Text').value = '';
      };
    });
    if ($('clBtn')) $('clBtn').onclick = function () { this.disabled = true; toast('กำลังเพิ่มจากเช็กลิสต์…'); act({ ct: 'checklist', caseId: c.id }, 'เพิ่มขั้นตอนจากเช็กลิสต์แล้ว').catch(function () {}); };
    bindProof($('sheetBody'), c.id, '');
    if (first) { if (DESK.matches) $('sheet').scrollTop = 0; else window.scrollTo(0, 0); }
    if (HIST[c.id]) paintHistory(c.id, HIST[c.id]);
    if (first) loadHistory();
  }

  function bindProof(root, caseId, taskId) {
    var q = function (c) { return root.querySelector('.' + c); };
    var photo = null;
    q('pfPhoto').onchange = function () {
      var f = this.files && this.files[0];
      photo = null; q('pfThumb').style.display = 'none';
      if (q('pfName')) q('pfName').textContent = f ? f.name : '';
      if (!f) return;
      shrink(f).then(function (dataUrl) { photo = dataUrl; q('pfThumb').src = dataUrl; q('pfThumb').style.display = 'block'; })
        .catch(function () { toast('อ่านรูปไม่ได้', true); });
    };
    q('pfBtn').onclick = function () {
      var note = q('pfNote').value.trim();
      if (!note && !photo) { toast('ใส่ข้อความหรือเลือกรูป', true); return; }
      var btn = this; btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
      act({ ct: 'proof', caseId: caseId, taskId: taskId, note: note, photo: photo }, 'บันทึกหลักฐานแล้ว').then(function () {
        if (taskId) closeProof(); else { q('pfNote').value = ''; }
      }, function () { btn.disabled = false; btn.textContent = 'บันทึกหลักฐาน'; });
    };
  }

  /** Phone photos are large: resize to at most 1600 px and re-encode as JPEG before upload. */
  function shrink(file) {
    return new Promise(function (ok, bad) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.width, img.height));
        var cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        ok(cv.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function () { URL.revokeObjectURL(url); bad(); };
      img.src = url;
    });
  }

  function openProof(caseId, taskId) {
    var t = D.tasks.filter(function (x) { return x.id === taskId; })[0];
    var c = caseOf(caseId);
    var host = document.createElement('div');
    host.className = 'sheet open modal'; host.style.zIndex = 25;
    host.innerHTML = '<div class="inner"><div class="top"><button class="btn ghost sm pfBack">‹ กลับ</button><div class="grow name">หลักฐาน ' + esc(taskId) + '</div></div>' +
      '<div class="body"><div class="card form"><div class="muted">' + esc(caseId + ' ' + (c ? c.name : '')) + '</div><div>' + esc(t ? t.text : '') + '</div>' +
      '<textarea class="pfNote" placeholder="ทำอะไรไป / ผลเป็นอย่างไร"></textarea><div class="file"><label>📷 แนบรูป<input type="file" class="pfPhoto" accept="image/*"></label><span class="muted pfName"></span></div><img class="thumb pfThumb" alt="">' +
      '<button class="btn pfBtn">บันทึกหลักฐาน</button></div></div></div>';
    host.onclick = function (e) { if (e.target === host) closeProof(); };
    document.body.appendChild(host);
    closeProof = function () { host.remove(); closeProof = function () {}; };
    host.querySelector('.pfBack').onclick = function () { closeProof(); };
    bindProof(host, caseId, taskId);
  }
  var closeProof = function () {};

  function loadHistory() {
    if (!openCase) return;
    var id = openCase;
    call({ ct: 'history', caseId: id }).then(function (j) { paintHistory(id, j.history); })
      .catch(function (e) { if ($('hist') && !HIST[id]) $('hist').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
  }
  function paintHistory(id, list) {
    HIST[id] = list;
    if (openCase !== id || !$('hist')) return;
    $('hist').classList.remove('muted');
    $('hist').innerHTML = list.length ? list.map(function (h) {
        var proof = /^https?:\/\//.test(h.proof) ? '<a href="' + esc(h.proof) + '" target="_blank" rel="noopener">ดูรูป</a>' : esc(h.proof);
        return '<div class="hist"><span class="id">' + esc(thDate(h.at.slice(0, 10))) + ' ' + esc(h.at.slice(11, 16)) + '</span> <b>' + esc(h.kind) + '</b>' +
          (h.taskId ? ' <span class="id">' + esc(h.taskId) + '</span>' : '') + (h.detail ? ' ' + esc(h.detail) : '') +
          (proof ? '<div class="muted">' + proof + '</div>' : '') + '</div>';
      }).join('') : '<span class="muted">ยังไม่มี</span>';
  }

  function closeSheet() { openCase = null; newCaseOpen = false; $('sheet').classList.remove('open'); render(); }
  DESK.addEventListener ? DESK.addEventListener('change', function () { if (openCase) renderCase(); render(); }) : DESK.addListener(function () { render(); });
  $('back').onclick = closeSheet;
  $('tCases').onclick = function () { view = 'cases'; filter = 'all'; render(); };
  $('tTasks').onclick = function () { view = 'tasks'; filter = 'all'; render(); };

  /* ---------- new case ---------- */
  $('fab').onclick = function () {
    openCase = null; newCaseOpen = true; render();
    $('sheet').classList.add('open');
    $('back').classList.remove('hide'); $('back').textContent = DESK.matches ? '✕ ปิด' : '‹ กลับ';
    $('sheetTitle').textContent = 'คดีใหม่';
    var types = ['มีตัวควบคุม', 'ประกันตัว', 'หมายเรียก', 'รู้ตัวหลบหนี', 'ไม่รู้ตัว', 'ตรวจสอบ'];
    $('sheetBody').innerHTML = '<div class="card form">' +
      '<input type="text" id="ncName" placeholder="ชื่อคดี เช่น ลักทรัพย์ นายสมชาย">' +
      '<input type="text" id="ncType" placeholder="ประเภทคดี เช่น ลักทรัพย์">' +
      '<div class="two"><select id="ncFile">' + types.map(function (t) { return '<option>' + t + '</option>'; }).join('') + '</select>' +
      '<input type="text" id="ncNo" placeholder="เลขคดี 900/2569"></div>' +
      '<div class="two"><label class="muted">รับคำร้องทุกข์<input type="date" id="ncG" value="' + D.today + '"></label>' +
      '<label class="muted">จับ/แจ้งข้อหา<input type="date" id="ncH"></label></div>' +
      '<input type="text" id="ncFolder" placeholder="ชื่อโฟลเดอร์ใน #สภ.บางใหญ่ (ให้ไฟล์ในโฟลเดอร์เป็นหลักฐานอัตโนมัติ)">' +
      '<div class="muted">ชุดเช็กลิสต์</div><div class="sets">' + D.sets.map(function (s) {
        return '<label><input type="checkbox" value="' + esc(s) + '"' + (s === 'ทุกคดี' ? ' checked' : '') + '>' + esc(s) + '</label>';
      }).join('') + '</div><button class="btn" id="ncBtn">สร้างคดีและเพิ่มงานจากเช็กลิสต์</button></div>';
    $('ncBtn').onclick = function () {
      var name = $('ncName').value.trim();
      if (!name) { toast('ใส่ชื่อคดีก่อน', true); return; }
      var sets = [].slice.call($('sheetBody').querySelectorAll('.sets input:checked')).map(function (x) { return x.value; });
      this.disabled = true;
      toast('กำลังสร้างคดี…');
      send({ ct: 'addCase', data: { name: name, type: $('ncType').value.trim(), fileType: $('ncFile').value, caseNo: $('ncNo').value.trim(),
        complaint: $('ncG').value, charge: $('ncH').value, folder: $('ncFolder').value.trim(), sets: sets } })
        .then(function (j) { setD(j); openCase = j.newId; return sets.length ? send({ ct: 'checklist', caseId: j.newId }) : j; })
        .then(function () { toast('สร้างคดีแล้ว'); newCaseOpen = false; renderCase(true); render(); })
        .catch(function (e) { toast(e.message, true); $('ncBtn').disabled = false; });
    };
  };

  /* Show the copy from last time at once (dates counted from today), then refresh from the Sheet. */
  try {
    var last = JSON.parse(localStorage.getItem(SNAP) || 'null');
    if (last && last.cases) {
      var n = new Date(), pad = function (x) { return (x < 10 ? '0' : '') + x; };
      last.today = n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate());
      D = last; render(); sync('กำลังอัปเดต…');
    }
  } catch (e) { /* ignore */ }
  call({ ct: 'load' }).then(function () { sync(); rerender(); }).catch(function (e) {
    if (/ไม่มีสิทธิ์|รหัสเจ้าของ/.test(e.message)) { try { localStorage.removeItem(SNAP); } catch (x) { /* ignore */ } }
    if (/รหัสเจ้าของ/.test(e.message)) return;
    if (D) { sync(''); toast(e.message, true); } else $('main').innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
  });
})();
</script>
</body>
</html>
